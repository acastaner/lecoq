[package]
name = "lecoq"
description = "A small, very fast image viewer and quick editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# AVIF (libavif + dav1d, §5.1). Building it needs cmake, meson, ninja and nasm; release builds and
# the gate turn it on.
avif = ["lecoq-codec/avif"]

[dependencies]
lecoq-core.workspace = true
lecoq-codec.workspace = true
lecoq-platform.workspace = true
lecoq-siblings.workspace = true
lecoq-render.workspace = true
toml.workspace = true
eframe.workspace = true
egui.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# Golden PNGs (tests/golden) and generated fixtures.
image = { workspace = true, features = ["png"] }

# Linux packages (#41, spec §8.5), built by packaging/linux/build.sh (see packaging/README.md).
# Source paths are relative to this crate; target/release/lecoq maps to the workspace target.
# winit and glutin dlopen the Wayland, X11 and GL libraries, so the shared-library scan can't see
# them: they are listed by hand. Neither package sets lecoq as a default handler.
[package.metadata.deb]
maintainer = "Arnaud Castaner"
copyright = "2026, Arnaud Castaner"
section = "graphics"
priority = "optional"
extended-description = """\
lecoq is a small, very fast image viewer and quick editor. The wheel or the arrow keys move \
through the other images in the same folder, and images can be marked up with shapes, text, \
numbered steps, highlights and blur, then saved or copied."""
depends = "$auto, libwayland-client0, libwayland-egl1, libxkbcommon0, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6"
recommends = "xdg-desktop-portal"
# lecoq was called zimged up to v0.1.6 (#51): installing it removes the old package.
replaces = "zimged"
conflicts = "zimged"
assets = [
    ["target/release/lecoq", "usr/bin/", "755"],
    ["../../packaging/linux/lecoq.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/lecoq.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/io.github.acastaner.lecoq.metainfo.xml", "usr/share/metainfo/", "644"],
]

[package.metadata.generate-rpm]
summary = "A small, very fast image viewer and quick editor"
assets = [
    { source = "target/release/lecoq", dest = "/usr/bin/lecoq", mode = "755" },
    { source = "../../packaging/linux/lecoq.desktop", dest = "/usr/share/applications/lecoq.desktop", mode = "644" },
    { source = "../../packaging/linux/lecoq.svg", dest = "/usr/share/icons/hicolor/scalable/apps/lecoq.svg", mode = "644" },
    { source = "../../packaging/linux/io.github.acastaner.lecoq.metainfo.xml", dest = "/usr/share/metainfo/io.github.acastaner.lecoq.metainfo.xml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/lecoq/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libwayland-client" = "*"
"libwayland-egl" = "*"
"libxkbcommon" = "*"
"libglvnd-egl" = "*"
"libglvnd-glx" = "*"
"libX11" = "*"
"libX11-xcb" = "*"
"libXcursor" = "*"
"libXrandr" = "*"
"libXi" = "*"

[package.metadata.generate-rpm.recommends]
"xdg-desktop-portal" = "*"

# lecoq was called zimged up to v0.1.6 (#51): installing it removes the old package.
[package.metadata.generate-rpm.obsoletes]
"zimged" = "*"
