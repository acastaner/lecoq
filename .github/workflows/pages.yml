# lecoq -- publish the static landing page (site/) to GitHub Pages.
# Runs on a push to master that touches site/, and can be run by hand
# (Actions > pages > Run workflow, or `gh workflow run pages.yml`). It uploads
# the site/ folder as a Pages artifact and deploys it; it builds nothing.
# Requires the repo's Pages source set to "GitHub Actions" one time
# (Settings > Pages > Build and deployment > Source).
name: pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/ to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
